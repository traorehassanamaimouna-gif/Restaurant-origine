    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>

    <ul>
        <li><a href="index.html">Accueil</a></li>

<section class="commande">

    <h2>Finaliser votre commande</h2>

    <p>Remplissez ce formulaire pour passer votre commande.</p>

    <form>

        <label>Nom complet</label>
        <input type="text" placeholder="Votre nom" required>

        <label>Téléphone</label>
        <input type="tel" placeholder="Votre numéro" required>

        <label>Plat choisi</label>
        <select required>
            <option>Alloco</option>
            <option>Salade tropicale</option>
            <option>Attiéké poisson</option>
            <option>Poulet braisé</option>
            <option>foutou sauce graine</option>
            <option>Mafé</option>
            <option>riz djolofe</option>
            <option>Thiéboudienne</option>
        </select>

        <label>Boisson</label>
        <select>
            <option>Aucune</option>
            <option>jus de tamarin</option>
            <option>Jus de bissap</option>
            <option>Jus de gingembre</option>
        </select>

        <label>Quantité</label>
        <input type="number" min="1" value="1">

        <label>Piment</label>
        <select>
            <option>Sans piment</option>
            <option>Piment léger</option>
            <option>Très pimenté</option>
        </select>

        <label>Adresse de livraison</label>
        <textarea rows="3" placeholder="Entrez votre adresse"></textarea>

        <label>Instructions supplémentaires</label>
        <textarea rows="4" placeholder="Exemple : sans oignons, plus de sauce..."></textarea>

        <button type="submit">Valider la commande</button>

    </form>

</section>

<footer>
    <p>© 2026 Restaurant ORIGINE - Tous droits réservés.</p>
</footer>

</body>
</html>
